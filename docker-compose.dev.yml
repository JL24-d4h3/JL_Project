services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cdn_dev
      POSTGRES_USER: cdn_user
      POSTGRES_PASSWORD: cdn_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
